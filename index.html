      :root {
        --primary: #0078d4;
        --primary-dark: #005a9e;
        --primary-light: #e6f2ff;
        --secondary: #106ebe;
        --success: #107c10;
        --warning: #ffb900;
        --danger: #d13438;
        --gray-100: #f8f9fa;
        --gray-200: #e9ecef;
        --gray-300: #dee2e6;
        --gray-600: #6c757d;
        --gray-800: #343a40;
        --shadow: 0 4px 20px rgba(0, 120, 212, 0.15);
        --radius: 12px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif;
        background: linear-gradient(135deg, #e8f4fc 0%, #f0f7ff 100%);
        min-height: 100vh;
        color: var(--gray-800);
        line-height: 1.6;
      }

      .header {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        color: white;
        padding: 2rem;
        text-align: center;
        box-shadow: var(--shadow);
      }

      .header h1 {
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
      }

      .header p {
        opacity: 0.9;
        font-size: 0.95rem;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 1.5rem;
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 1.5rem;
        align-items: center;
      }

      .search-box {
        flex: 1;
        min-width: 280px;
        position: relative;
      }

      .search-box i {
        position: absolute;
        left: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--gray-600);
      }

      .search-box input {
        width: 100%;
        padding: 0.875rem 1rem 0.875rem 2.75rem;
        border: 2px solid var(--gray-200);
        border-radius: var(--radius);
        font-size: 0.95rem;
        transition: all 0.3s;
        background: white;
      }

      .search-box input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px rgba(0, 120, 212, 0.1);
      }

      .filter-select {
        padding: 0.875rem 2.5rem 0.875rem 1rem;
        border: 2px solid var(--gray-200);
        border-radius: var(--radius);
        font-size: 0.95rem;
        background: white
          url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%236b7280' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e")
          right 0.75rem center/1.5em no-repeat;
        cursor: pointer;
        appearance: none;
        min-width: 160px;
      }

      .filter-select:focus {
        outline: none;
        border-color: var(--primary);
      }

      .stats {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .stat-badge {
        background: white;
        padding: 0.5rem 1rem;
        border-radius: 2rem;
        font-size: 0.85rem;
        font-weight: 500;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .stat-badge i {
        color: var(--primary);
      }

      .table-wrapper {
        background: white;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
        animation: fadeIn 0.5s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .table-scroll {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 900px;
      }

      th {
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        color: white;
        padding: 1rem;
        text-align: left;
        font-weight: 600;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        cursor: pointer;
        white-space: nowrap;
        position: sticky;
        top: 0;
        z-index: 10;
        transition: background 0.3s;
      }

      th:hover {
        background: var(--primary-dark);
      }

      th i {
        margin-left: 0.5rem;
        opacity: 0.7;
      }

      td {
        padding: 0.875rem 1rem;
        border-bottom: 1px solid var(--gray-200);
        font-size: 0.9rem;
        vertical-align: top;
      }

      tr {
        transition: all 0.2s;
      }

      tbody tr:hover {
        background: var(--primary-light);
        transform: scale(1.002);
      }

      .badge {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 2rem;
        font-size: 0.75rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
      }

      .badge-ksap {
        background: #dbeafe;
        color: #1e40af;
      }
      .badge-perpres {
        background: #fef3c7;
        color: #92400e;
      }
      .badge-surat {
        background: #d1fae5;
        color: #065f46;
      }
      .badge-uu {
        background: #fee2e2;
        color: #991b1b;
      }
      .badge-perpu {
        background: #f3e8ff;
        color: #6b21a8;
      }
      .badge-default {
        background: var(--gray-200);
        color: var(--gray-600);
      }

      .status-berlaku {
        color: var(--success);
        font-weight: 600;
      }
      .status-dicabut {
        color: var(--danger);
        font-weight: 600;
      }
      .status-diubah {
        color: var(--warning);
        font-weight: 600;
      }

      .btn-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.5rem 1rem;
        background: linear-gradient(
          135deg,
          var(--primary) 0%,
          var(--secondary) 100%
        );
        color: white;
        text-decoration: none;
        border-radius: 2rem;
        font-size: 0.8rem;
        font-weight: 500;
        transition: all 0.3s;
        white-space: nowrap;
      }

      .btn-link:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(0, 120, 212, 0.3);
      }

      .pagination {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 0.5rem;
        padding: 1.5rem;
        flex-wrap: wrap;
      }

      .page-btn {
        padding: 0.5rem 1rem;
        border: 2px solid var(--gray-200);
        background: white;
        border-radius: 0.5rem;
        cursor: pointer;
        font-weight: 500;
        transition: all 0.2s;
      }

      .page-btn:hover:not(:disabled) {
        border-color: var(--primary);
        color: var(--primary);
      }

      .page-btn.active {
        background: var(--primary);
        color: white;
        border-color: var(--primary);
      }

      .page-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .no-results {
        text-align: center;
        padding: 3rem;
        color: var(--gray-600);
      }

      .no-results i {
        font-size: 3rem;
        margin-bottom: 1rem;
        opacity: 0.5;
      }

      .footer {
        text-align: center;
        padding: 2rem;
        color: var(--gray-600);
        font-size: 0.85rem;
      }

      @media (max-width: 768px) {
        .header h1 {
          font-size: 1.25rem;
        }
        .controls {
          flex-direction: column;
        }
        .search-box {
          min-width: 100%;
        }
        td,
        th {
          padding: 0.75rem 0.5rem;
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <h1><i class="fas fa-book-open"></i> Database Peraturan Keuangan & BMN</h1>
      <p>Kementerian Kelautan dan Perikanan Republik Indonesia</p>
    </div>

    <div class="container">
      <div class="controls">
        <div class="search-box">
          <i class="fas fa-search"></i>
          <input
            type="text"
            id="searchInput"
            placeholder="Cari peraturan..."
            oninput="filterTable()"
          />
        </div>
        <select
          class="filter-select"
          id="folderFilter"
          onchange="filterTable()"
        >
          <option value="">Semua Kategori</option>
          <option value="KSAP">KSAP</option>
          <option value="Perpres">Perpres</option>
          <option value="Surat Kemenkeu">Surat Kemenkeu</option>
          <option value="Undang Undang">Undang-Undang</option>
          <option value="PERPU">PERPU</option>
        </select>
        <select
          class="filter-select"
          id="statusFilter"
          onchange="filterTable()"
        >
          <option value="">Semua Status</option>
          <option value="Berlaku">Berlaku</option>
          <option value="Dicabut">Dicabut</option>
          <option value="Diubah">Diubah</option>
        </select>
        <div class="stats">
          <div class="stat-badge">
            <i class="fas fa-file-alt"></i>
            <span id="totalCount">0</span> Dokumen
          </div>
          <div class="stat-badge">
            <i class="fas fa-filter"></i>
            <span id="filteredCount">0</span> Ditampilkan
          </div>
        </div>
      </div>

      <div class="table-wrapper">
        <div class="table-scroll">
          <table id="dataTable">
            <thead>
              <tr>
                <th onclick="sortTable(0)">No <i class="fas fa-sort"></i></th>
                <th onclick="sortTable(1)">
                  Tahun <i class="fas fa-sort"></i>
                </th>
                <th onclick="sortTable(2)">
                  Kategori <i class="fas fa-sort"></i>
                </th>
                <th onclick="sortTable(3)">
                  Nama File <i class="fas fa-sort"></i>
                </th>
                <th onclick="sortTable(4)">
                  Nama Aturan <i class="fas fa-sort"></i>
                </th>
                <th>Link</th>
                <th onclick="sortTable(6)">
                  Status <i class="fas fa-sort"></i>
                </th>
              </tr>
            </thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <div id="noResults" class="no-results" style="display: none">
          <i class="fas fa-search"></i>
          <p>Tidak ada hasil ditemukan</p>
        </div>
      </div>

      <div class="pagination" id="pagination"></div>
    </div>

    <div class="footer">
      <p>&copy; 2025 Database Peraturan KKP. Dikelola oleh Rokeubmn.</p>
    </div>

      let filteredData = [...allData];
      let currentPage = 1;
      const rowsPerPage = 25;
      let sortCol = -1;
      let sortAsc = true;

      function getBadgeClass(folder) {
        const f = folder.toLowerCase();
        if (f.includes("ksap")) return "badge-ksap";
        if (f.includes("perpres")) return "badge-perpres";
        if (f.includes("surat")) return "badge-surat";
        if (f.includes("undang")) return "badge-uu";
        if (f.includes("perpu")) return "badge-perpu";
        return "badge-default";
      }

      function getStatusClass(status) {
        const s = status.toLowerCase();
        if (s.includes("berlaku") && !s.includes("tidak"))
          return "status-berlaku";
        if (s.includes("dicabut") || s.includes("tidak"))
          return "status-dicabut";
        if (s.includes("diubah")) return "status-diubah";
        return "";
      }

      function filterTable() {
        const search = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const folder = document
          .getElementById("folderFilter")
          .value.toLowerCase();
        const status = document
          .getElementById("statusFilter")
          .value.toLowerCase();

        filteredData = allData.filter((row) => {
          const matchSearch =
            !search ||
            row.no.toLowerCase().includes(search) ||
            row.tahun.toLowerCase().includes(search) ||
            row.folder.toLowerCase().includes(search) ||
            row.file.toLowerCase().includes(search) ||
            row.aturan.toLowerCase().includes(search) ||
            row.status.toLowerCase().includes(search);
          const matchFolder =
            !folder || row.folder.toLowerCase().includes(folder);
          const matchStatus =
            !status || row.status.toLowerCase().includes(status);
          return matchSearch && matchFolder && matchStatus;
        });

        currentPage = 1;
        renderTable();
      }

      function sortTable(col) {
        const keys = [
          "no",
          "tahun",
          "folder",
          "file",
          "aturan",
          "link",
          "status",
        ];
        if (sortCol === col) sortAsc = !sortAsc;
        else {
          sortCol = col;
          sortAsc = true;
        }

        filteredData.sort((a, b) => {
          let valA = a[keys[col]] || "";
          let valB = b[keys[col]] || "";
          if (col <= 1) {
            valA = parseFloat(valA) || 0;
            valB = parseFloat(valB) || 0;
          }
          if (valA < valB) return sortAsc ? -1 : 1;
          if (valA > valB) return sortAsc ? 1 : -1;
          return 0;
        });
        renderTable();
      }

      function renderTable() {
        const tbody = document.getElementById("tableBody");
        const noResults = document.getElementById("noResults");
        const totalPages = Math.ceil(filteredData.length / rowsPerPage);
        const start = (currentPage - 1) * rowsPerPage;
        const pageData = filteredData.slice(start, start + rowsPerPage);

        document.getElementById("totalCount").textContent = allData.length;
        document.getElementById("filteredCount").textContent =
          filteredData.length;

        if (pageData.length === 0) {
          tbody.innerHTML = "";
          noResults.style.display = "block";
          document.getElementById("pagination").innerHTML = "";
          return;
        }

        noResults.style.display = "none";
        tbody.innerHTML = pageData
          .map(
            (row) => `
        <tr>
            <td>${row.no}</td>
            <td>${row.tahun}</td>
            <td><span class="badge ${getBadgeClass(row.folder)}">${
              row.folder || "-"
            }</span></td>
            <td>${row.file}</td>
            <td>${row.aturan}</td>
            <td>${
              row.link
                ? `<a href="${row.link}" target="_blank" class="btn-link"><i class="fas fa-external-link-alt"></i> Buka</a>`
                : "-"
            }</td>
            <td class="${getStatusClass(row.status)}">${row.status || "-"}</td>
        </tr>
    `
          )
          .join("");

        // Pagination
        let pagHTML = "";
        pagHTML += `<button class="page-btn" onclick="goToPage(1)" ${
          currentPage === 1 ? "disabled" : ""
        }><i class="fas fa-angle-double-left"></i></button>`;
        pagHTML += `<button class="page-btn" onclick="goToPage(${
          currentPage - 1
        })" ${
          currentPage === 1 ? "disabled" : ""
        }><i class="fas fa-angle-left"></i></button>`;

        let startP = Math.max(1, currentPage - 2);
        let endP = Math.min(totalPages, currentPage + 2);
        for (let i = startP; i <= endP; i++) {
          pagHTML += `<button class="page-btn ${
            i === currentPage ? "active" : ""
          }" onclick="goToPage(${i})">${i}</button>`;
        }

        pagHTML += `<button class="page-btn" onclick="goToPage(${
          currentPage + 1
        })" ${
          currentPage === totalPages ? "disabled" : ""
        }><i class="fas fa-angle-right"></i></button>`;
        pagHTML += `<button class="page-btn" onclick="goToPage(${totalPages})" ${
          currentPage === totalPages ? "disabled" : ""
        }><i class="fas fa-angle-double-right"></i></button>`;
        document.getElementById("pagination").innerHTML = pagHTML;
      }

      function goToPage(page) {
        const totalPages = Math.ceil(filteredData.length / rowsPerPage);
        if (page < 1 || page > totalPages) return;
        currentPage = page;
        renderTable();
        document
          .querySelector(".table-wrapper")
          .scrollIntoView({ behavior: "smooth" });
      }

      // Initialize
      document.addEventListener("DOMContentLoaded", () => {
        renderTable();
      });
